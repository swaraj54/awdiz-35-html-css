<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home"
    />
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      #screen {
        /* border: 5px solid red; */
        height: 100vh;
      }
      #navCnt {
        height: 28vh;
        border-bottom: 2px solid grey;
        background-color: #e8e8e8;
      }
      #topNavCnt {
        /* border: 5px solid blue; */
        height: 50%;
        display: flex;
        justify-content: space-between;
        width: 96%;
        margin: auto;
      }
      #botNavCnt {
        /* border: 2px solid yellow; */
        height: 50%;
      }

      #navLogo {
        /* border: 2px solid purple; */
        width: 10%;
      }
      #navNavi {
        /* border: 2px solid orange; */
        width: 30%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #navNavi > div {
        /* border: 1px solid black; */
        display: flex;
        gap: 10px;
      }
      #navProfile {
        /* border: 2px solid pink; */
        width: 16%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .imgStyle {
        width: 100%;
        height: 100%;
      }
      .bgCircle {
        background-color: rgb(160, 160, 160);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hoverEffect {
        padding: 0 10px;
      }
      .hoverEffect:hover {
        background-color: rgb(160, 160, 160);
        height: 34px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div id="screen">
      <div id="navCnt">
        <div id="topNavCnt">
          <div id="navLogo">
            <img
              class="imgStyle"
              src="https://www.logo.wine/a/logo/Airbnb/Airbnb-Logo.wine.svg"
              alt="Airbnb"
            />
          </div>
          <div id="navNavi">
            <div>
              <span class="material-symbols-outlined"> home </span>
              <h4>Homes</h4>
            </div>
            <div>
              <span class="material-symbols-outlined"> home </span>
              <h4>Experiences</h4>
            </div>
            <div>
              <span class="material-symbols-outlined"> home </span>
              <h4>Services</h4>
            </div>
          </div>
          <div id="navProfile">
            <div class="hoverEffect">Become Host</div>
            <div class="bgCircle">
              <span class="material-symbols-outlined"> home </span>
            </div>
            <div class="bgCircle">
              <span class="material-symbols-outlined"> home </span>
            </div>
          </div>
        </div>
        <div id="botNavCnt"></div>
      </div>
      <div id="bodyCnt"></div>
    </div>
  </body>
</html>
